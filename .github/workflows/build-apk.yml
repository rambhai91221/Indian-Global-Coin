name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "whitepaper.html"
      - "logo.png"
      - "style.css"
      - "script.js"
      - "banner.jpg"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Code लें
        uses: actions/checkout@v4

      - name: Node सेट करें
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java सेट करें
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: ImageMagick install और Fix करें
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          # ImageMagick security policy bypass करें ताकि PNG प्रोसेस हो सके
          sudo sed -i '/<policy domain="path" rights="none" pattern="@\*"/d' /etc/ImageMagick-6/policy.xml || true

      - name: साइट का पता निकालें
        id: url
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "${REPO,,}" = "${OWNER}.github.io" ]; then
            URL="https://${OWNER}.github.io/"
          else
            URL="https://${OWNER}.github.io/${REPO}/"
          fi
          echo "साइट: $URL"
          echo "site=$URL" >> "$GITHUB_OUTPUT"

      - name: ऐप प्रोजेक्ट बनाएँ
        env:
          SITE: ${{ steps.url.outputs.site }}
        run: |
          mkdir cap && cd cap
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          
          # सभी ज़रूरी फाइलें कॉपी करें (HTML, CSS, JS, Images)
          cp ../*.html ../*.css ../*.js www/ || true
          cp ../logo.png ../banner.jpg www/ || true
          
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.indianglobalcoin.app",
            "appName": "Indian Global Coin",
            "webDir": "www",
            "server": { "url": "$SITE" }
          }
          EOF
          
          npx cap add android

      - name: आपके Logo से ऐप का Icon बनाएँ
        working-directory: cap
        run: |
          if [ ! -f ../logo.png ]; then
            echo "❌ ERROR: logo.png नहीं मिला repo में।"
            exit 1
          fi

          mkdir -p assets
          
          # 1024x1024 icon बनाएँ
          convert ../logo.png -resize 900x900 -background none -gravity center -extent 1024x1024 assets/icon-only.png
          
          # Foreground (adaptive icon के लिए)
          convert ../logo.png -resize 660x660 -background none -gravity center -extent 1024x1024 assets/icon-foreground.png
          
          # Background (dark color)
          convert -size 1024x1024 xc:'#0d1014' assets/icon-background.png
          
          # Splash screen
          convert ../logo.png -resize 512x512 -background '#0d1014' -gravity center -extent 2732x2732 assets/splash.png

          npm i -D @capacitor/assets@3
          npx capacitor-assets generate --android

      - name: फ़ाइलें sync करें
        working-directory: cap
        run: npx cap sync android

      - name: Local properties सेट करें (Gradle fix)
        working-directory: cap/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: APK बनाएँ
        working-directory: cap/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK upload करें
        uses: actions/upload-artifact@v4
        with:
          name: IGC-app
          path: cap/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
